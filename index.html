    <script>
      // Set theme before first paint. Explicit choice (toggle) wins; otherwise
      // the hour decides: daytime reads on paper+teal, night on ink+teal.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var light;
          if (t === 'light') light = true;
          else if (t === 'dark') light = false;
          else {
            var h = new Date().getHours();
            light = h >= 7 && h < 19;
          }
          if (light) document.documentElement.classList.add('light');
        } catch (e) {}
      })();
    </script>
    <script>
      // GitHub Pages SPA fallback: decode the path 404.html encoded into the
      // query string, and rewrite legacy #/route URLs from the HashRouter era.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        } else if (l.hash.slice(0, 2) === '#/') {
          window.history.replaceState(null, '', l.hash.slice(1));
        }
      })(window.location);
    </script>
    <script>
